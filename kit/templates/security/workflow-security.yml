name: Security baseline
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install pinned and checksum-verified scanner
        run: |
          set -eu
          tmp="$RUNNER_TEMP/gitleaks"
          mkdir -p "$tmp"
          cd "$tmp"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$tmp" >> "$GITHUB_PATH"
      - name: Scan all Git history
        run: gitleaks git . --log-opts=--all --redact --no-banner --ignore-gitleaks-allow
